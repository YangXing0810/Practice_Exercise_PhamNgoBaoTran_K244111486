<h2>Product Catalog</h2>
<div *ngFor="let c of categories" class="category">
    <h3>{{c.Cateid}} - {{c.CateName}}</h3>
    <table border="1">
        <tr>
            <td>Product ID</td>
            <td>Product Name</td>
            <td>Price</td>
            <td>Picture</td>
        </tr>
        <tr *ngFor="let p of c.Products">
            <td>{{p.ProductId}}</td>
            <td>{{p.ProductName}}</td>
            <td>{{p.Price}}</td>
            <td><img [src]="p.Image"></td>
        </tr>
    </table>
</div>
