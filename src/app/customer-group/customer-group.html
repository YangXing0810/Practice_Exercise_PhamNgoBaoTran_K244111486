<p>customer-group works!</p>
{{errMessage()}}
<table border="1">
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>#</th>
    </tr>
    <tbody *ngFor="let g of customerGroups()">
        <tr>
            <td colspan="5">{{g.CustomerTypeId}} - {{g.CustomterTypeName}}</td>
        </tr>
        <tr *ngFor="let c of g.Customers">
            <td>{{c.Id}}</td>
            <td>{{c.Name}}</td>
            <td>{{c.Email}}</td>
            <td>{{c.Age}}</td>
            <td><img [src]="c.Image" [alt]="c.Name" (error)="onImageError($event, c.Name)" class="customer-avatar"></td>
        </tr>
    </tbody>
</table>
